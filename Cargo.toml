[package]
name = "cryptid-rs"
version = "0.1.2"
authors = ["Ville Laurikari <ville@laurikari.net>"]
edition = "2021"
description = "A library to encrypt and decrypt integer IDs to URL safe strings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/laurikari/cryptid-rs"
readme = "README.md"

[lib]
name = "cryptid_rs"
path = "src/lib.rs"

[dev-dependencies]
criterion = "^0.7.0"
rand = "^0.9.2"
serde_json = "^1.0.145"

[dependencies]
aes = "^0.8.4"
base62 = "^2.2.3"
diesel = { version = ">=2.1.1, <3.0", features = ["postgres"], optional = true }
fpe = "^0.6.1"
hkdf = "^0.12.4"
hmac = { version = "^0.12.1", features = ["reset"] }
once_cell = "^1.21.3"
paste = "^1.0"
serde = { version = "^1.0.228", features = ["derive"] }
sha2 = "^0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres"], optional = true }
uuid = "^1.18.1"

# Optional derive macro support
cryptid-derive = { path = "cryptid-derive", optional = true }

[features]
default = ["diesel"]
diesel = ["dep:diesel"]
sqlx = ["dep:sqlx"]
derive = ["cryptid-derive"]
