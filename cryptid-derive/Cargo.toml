[package]
name = "cryptid-derive"
version = "0.2.0"
authors = ["Ville Laurikari <ville@laurikari.net>"]
edition = "2021"
description = "Procedural macros for cryptid-rs"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "^1.0"
quote = "^1.0"
syn = { version = "^2.0", features = ["full"] }

[features]
default = []
utoipa = []
